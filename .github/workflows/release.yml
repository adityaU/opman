name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Build React frontend (platform-independent) ──────────
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-ui/package-lock.json

      - name: Install React UI npm deps
        run: npm ci
        working-directory: web-ui

      - name: Build React UI
        run: npm run build
        working-directory: web-ui

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: web-ui/dist/
          retention-days: 1

  # ── Build backend for each target ──────────────────────────────
  build-backend:
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-13
            target: x86_64-apple-darwin
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          show-progress: false

      - name: Download frontend artifacts
        uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: web-ui/dist

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry + build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-

      - name: Install zigbuild (Linux cross-compilation)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install Zig (Linux cross-compilation)
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Build release binary
        env:
          CARGO_TERM_COLOR: always
          RUST_BACKTRACE: 1
        run: |
          set -euxo pipefail
          rustc --version --verbose
          cargo --version --verbose
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            cargo zigbuild --release --target "${{ matrix.target }}" -vv
          else
            cargo build --release --target "${{ matrix.target }}" -vv
          fi

      - name: Package binary
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../opman-${{ matrix.target }}.tar.gz opman
          cd ../../..
          shasum -a 256 opman-${{ matrix.target }}.tar.gz > opman-${{ matrix.target }}.tar.gz.sha256

      - name: Upload release artifact
        uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.target }}
          path: |
            opman-${{ matrix.target }}.tar.gz
            opman-${{ matrix.target }}.tar.gz.sha256
          retention-days: 1

  # ── Create release artifacts ───────────────────────────
  publish:
    needs: build-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          show-progress: false

      - name: Download all release artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            opman-*.tar.gz
            opman-*.tar.gz.sha256
