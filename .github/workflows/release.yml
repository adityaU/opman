name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/builds.yml
    # Manual builds must not receive signing credentials.
    secrets:
      APPLE_CERTIFICATE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_CERTIFICATE || '' }}
      APPLE_CERTIFICATE_PASSWORD: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
      APPLE_SIGNING_IDENTITY: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_SIGNING_IDENTITY || '' }}
      APPLE_ID: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_ID || '' }}
      APPLE_PASSWORD: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_TEAM_ID || '' }}

  # ── Create release artifacts ───────────────────────────
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          show-progress: false

      - name: Download all release artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          merge-multiple: true

      # desktop-* also matches desktop-frontend-dist; only opman-desktop-* files are published.
      - name: Download desktop artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: desktop-*
          path: desktop-dist
          merge-multiple: true

      # Fixed-name copies, so README links to `releases/latest/download/...` stay correct.
      - name: Add fixed-name desktop installers
        run: .github/scripts/stable-desktop-names.sh desktop-dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            opman-*.tar.gz
            opman-*.tar.gz.sha256
            desktop-dist/opman-desktop-*.dmg
            desktop-dist/opman-desktop-*.dmg.sha256
            desktop-dist/opman-desktop-*.exe
            desktop-dist/opman-desktop-*.exe.sha256
            desktop-dist/opman-desktop-*.msi
            desktop-dist/opman-desktop-*.msi.sha256
            desktop-dist/opman-desktop-*.AppImage
            desktop-dist/opman-desktop-*.AppImage.sha256
            desktop-dist/opman-desktop-*.deb
            desktop-dist/opman-desktop-*.deb.sha256
            desktop-dist/opman-desktop-*.rpm
            desktop-dist/opman-desktop-*.rpm.sha256
            desktop-dist/latest/opman-desktop-latest-*
