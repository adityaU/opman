[package]
name = "opman-desktop"
version = "0.9.58"
description = "Desktop shell for opman"
edition = "2021"
publish = false

[[bin]]
name = "opman-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
