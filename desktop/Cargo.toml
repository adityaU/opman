[package]
name = "opman-desktop"
version = "0.9.60"
description = "Desktop shell for opman"
edition = "2021"
publish = false

[[bin]]
name = "opman-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
